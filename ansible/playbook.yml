---
# =============================================================================
# Multi-VM deployment for Billing App
# db-vm  -> PostgreSQL
# app-vm -> Backend + Frontend
# =============================================================================

# -----------------------------------------------------------------------------
# Play 1 — Database VM
# -----------------------------------------------------------------------------
- name: Deploy PostgreSQL database
  hosts: db_servers
  become: yes

  vars:
    db_name: "{{ db_name | default('billing_db') }}"
    db_user: "{{ db_user | default('billing_user') }}"
    db_password: "{{ db_password | default('billing_pass') }}"
    db_port: "{{ db_port | default('5432') }}"

  tasks:
    - name: Install Docker and Python dependencies
      apt:
        name:
          - docker.io
          - python3-pip
        state: present
        update_cache: yes

    - name: Install Python Docker SDK
      pip:
        name: docker
        state: present
        extra_args: --break-system-packages

    - name: Run PostgreSQL container
      community.docker.docker_container:
        name: billing-db
        image: postgres:16-alpine
        state: started
        restart_policy: unless-stopped
        recreate: yes
        env:
          POSTGRES_DB: "{{ db_name | string }}"
          POSTGRES_USER: "{{ db_user | string }}"
          POSTGRES_PASSWORD: "{{ db_password | string }}"
        published_ports:
          - "{{ db_port | string }}:5432"

    - name: Wait for PostgreSQL to be ready
      command: docker exec billing-db pg_isready -U {{ db_user }} -d {{ db_name }}
      register: pg_ready
      retries: 15
      delay: 3
      until: pg_ready.rc == 0
      changed_when: false

    - name: Ensure database schema exists
      command: docker exec -i billing-db psql -U {{ db_user }} -d {{ db_name }}
      args:
        stdin: |
          CREATE TABLE IF NOT EXISTS users (
              id SERIAL PRIMARY KEY,
              name VARCHAR(255) UNIQUE NOT NULL,
              password_hash VARCHAR(255) NOT NULL
          );

          CREATE TABLE IF NOT EXISTS expenses (
              id SERIAL PRIMARY KEY,
              user_id INTEGER REFERENCES users(id) ON DELETE CASCADE,
              title VARCHAR(255) NOT NULL,
              amount NUMERIC(10,2) NOT NULL,
              entity VARCHAR(255),
              description TEXT,
              due_date DATE,
              status VARCHAR(50) DEFAULT 'pending',
              created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
              updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
          );
      changed_when: false


# -----------------------------------------------------------------------------
# Play 2 — Backend VM
# -----------------------------------------------------------------------------
- name: Deploy backend
  hosts: backend_servers
  become: yes

  vars:
    dockerhub_user: "{{ dockerhub_user | default('dragneel277') }}"
    image_tag: "{{ image_tag | default('latest') }}"
    backend_port: "{{ backend_port | default('3000') }}"
    db_host: "{{ db_host }}"
    db_port: "{{ db_port | default('5432') }}"
    db_name: "{{ db_name | default('billing_db') }}"
    db_user: "{{ db_user | default('billing_user') }}"
    db_password: "{{ db_password | default('billing_pass') }}"
    jwt_secret: "{{ jwt_secret | default('mysecret123') }}"

  tasks:
    - name: Install Docker and Python dependencies
      apt:
        name:
          - docker.io
          - python3-pip
        state: present
        update_cache: yes

    - name: Install Python Docker SDK
      pip:
        name: docker
        state: present
        extra_args: --break-system-packages

    - name: Pull backend image from Docker Hub
      community.docker.docker_image:
        name: "{{ dockerhub_user }}/billing-backend:{{ image_tag }}"
        source: pull
        force_source: yes

    - name: Run backend container
      community.docker.docker_container:
        name: billing-backend
        image: "{{ dockerhub_user }}/billing-backend:{{ image_tag }}"
        state: started
        restart_policy: unless-stopped
        recreate: yes
        env:
          PORT: "{{ backend_port | string }}"
          DB_HOST: "{{ db_host | string }}"
          DB_PORT: "{{ db_port | string }}"
          DB_NAME: "{{ db_name | string }}"
          DB_USER: "{{ db_user | string }}"
          DB_PASSWORD: "{{ db_password | string }}"
          JWT_SECRET: "{{ jwt_secret | string }}"
          JWT_EXPIRES_IN: "24h"
        published_ports:
          - "{{ backend_port | string }}:{{ backend_port | string }}"

    - name: Wait for backend to respond
      uri:
        url: "http://localhost:{{ backend_port }}/auth/login"
        method: POST
        body_format: json
        body:
          name: "healthcheck"
          password: "healthcheck"
        status_code:
          - 401
          - 500
      register: backend_health
      retries: 10
      delay: 3
      until: backend_health.status in [401, 500]


# -----------------------------------------------------------------------------
# Play 3 — Frontend VM
# -----------------------------------------------------------------------------
- name: Deploy frontend
  hosts: frontend_servers
  become: yes

  vars:
    dockerhub_user: "{{ dockerhub_user | default('dragneel277') }}"
    image_tag: "{{ image_tag | default('latest') }}"
    app_port: "{{ app_port | default('3001') }}"
    backend_port: "{{ backend_port | default('3000') }}"
    backend_host: "{{ groups['backend_servers'][0] }}"

  tasks:
    - name: Install Docker and Python dependencies
      apt:
        name:
          - docker.io
          - python3-pip
        state: present
        update_cache: yes

    - name: Install Python Docker SDK
      pip:
        name: docker
        state: present
        extra_args: --break-system-packages

    - name: Pull frontend image from Docker Hub
      community.docker.docker_image:
        name: "{{ dockerhub_user }}/billing-frontend:{{ image_tag }}"
        source: pull
        force_source: yes

    - name: Run frontend container
      community.docker.docker_container:
        name: billing-frontend
        image: "{{ dockerhub_user }}/billing-frontend:{{ image_tag }}"
        state: started
        restart_policy: unless-stopped
        recreate: yes
        env:
          BACKEND_HOST: "{{ hostvars[backend_host].ansible_host }}"
          BACKEND_PORT: "{{ backend_port | string }}"
        published_ports:
          - "{{ app_port | string }}:80"

    - name: Wait for frontend to respond
      uri:
        url: "http://localhost:{{ app_port }}"
        method: GET
        status_code: 200
      register: frontend_health
      retries: 10
      delay: 3
      until: frontend_health.status == 200

    - name: Show running containers on app VM
      command: docker ps
      register: running_containers
      changed_when: false

    - name: Print running containers
      debug:
        var: running_containers.stdout_lines

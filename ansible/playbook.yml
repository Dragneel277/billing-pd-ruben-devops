---
# =============================================================================
# Multi-VM deployment for Billing App
# db-vm  -> PostgreSQL
# app-vm -> Backend + Frontend
# =============================================================================

# -----------------------------------------------------------------------------
# Play 1 — Database VM
# -----------------------------------------------------------------------------
- name: Deploy PostgreSQL database
  hosts: db_servers
  become: yes

  vars:
    database_name: "{{ db_name | default('billing_db') }}"
    database_user: "{{ db_user | default('billing_user') }}"
    database_password: "{{ db_password | default('billing_pass') }}"
    database_port: "{{ db_port | default('5432') }}"
    app_dir: "{{ deploy_dir | default('/opt/billing') }}"

  tasks:
    - name: Install Docker and Python dependencies
      apt:
        name:
          - docker.io
          - python3-pip
        state: present
        update_cache: yes

    - name: Install Python Docker SDK
      pip:
        name: docker
        state: present
        extra_args: --break-system-packages

    - name: Ensure Docker service is running
      service:
        name: docker
        state: started
        enabled: yes

    - name: Create application directory
      file:
        path: "{{ app_dir }}"
        state: directory
        mode: "0755"

    - name: Copy database init.sql to DB VM
      copy:
        src: ../backend/src/db/init.sql
        dest: "{{ app_dir }}/init.sql"
        mode: "0644"

    - name: Run PostgreSQL container with persistent volume
      community.docker.docker_container:
        name: billing-db
        image: postgres:16-alpine
        state: started
        restart_policy: unless-stopped
        recreate: yes
        env:
          POSTGRES_DB: "{{ database_name | string }}"
          POSTGRES_USER: "{{ database_user | string }}"
          POSTGRES_PASSWORD: "{{ database_password | string }}"
        volumes:
          - "billing_pgdata:/var/lib/postgresql/data"
        published_ports:
          - "{{ database_port | string }}:5432"

    - name: Wait for PostgreSQL to be ready
      command: docker exec billing-db pg_isready -U {{ database_user }} -d {{ database_name }}
      register: pg_ready
      retries: 20
      delay: 3
      until: pg_ready.rc == 0
      changed_when: false

    - name: Apply database schema from backend init.sql
      shell: docker exec -i billing-db psql -U {{ database_user }} -d {{ database_name }} < {{ app_dir }}/init.sql
      changed_when: false


# -----------------------------------------------------------------------------
# Play 2 — Backend VM
# -----------------------------------------------------------------------------
- name: Deploy backend
  hosts: backend_servers
  become: yes

  vars:
    backend_image_user: "{{ dockerhub_user | default('dragneel277') }}"
    backend_image_tag: "{{ image_tag | default('latest') }}"
    backend_container_port: "{{ backend_port | default('3000') }}"
    backend_db_host: "{{ db_host }}"
    backend_db_port: "{{ db_port | default('5432') }}"
    backend_db_name: "{{ db_name | default('billing_db') }}"
    backend_db_user: "{{ db_user | default('billing_user') }}"
    backend_db_password: "{{ db_password | default('billing_pass') }}"
    backend_jwt_secret: "{{ jwt_secret | default('mysecret123') }}"

  tasks:
    - name: Install Docker and Python dependencies
      apt:
        name:
          - docker.io
          - python3-pip
        state: present
        update_cache: yes

    - name: Install Python Docker SDK
      pip:
        name: docker
        state: present
        extra_args: --break-system-packages

    - name: Ensure Docker service is running
      service:
        name: docker
        state: started
        enabled: yes

    - name: Pull backend image from Docker Hub
      community.docker.docker_image:
        name: "{{ backend_image_user }}/billing-backend:{{ backend_image_tag }}"
        source: pull
        force_source: yes

    - name: Run backend container
      community.docker.docker_container:
        name: billing-backend
        image: "{{ backend_image_user }}/billing-backend:{{ backend_image_tag }}"
        state: started
        restart_policy: unless-stopped
        recreate: yes
        env:
          PORT: "{{ backend_container_port | string }}"
          DB_HOST: "{{ backend_db_host | string }}"
          DB_PORT: "{{ backend_db_port | string }}"
          DB_NAME: "{{ backend_db_name | string }}"
          DB_USER: "{{ backend_db_user | string }}"
          DB_PASSWORD: "{{ backend_db_password | string }}"
          JWT_SECRET: "{{ backend_jwt_secret | string }}"
          JWT_EXPIRES_IN: "24h"
        published_ports:
          - "{{ backend_container_port | string }}:{{ backend_container_port | string }}"

    - name: Wait for backend health endpoint to respond
      uri:
        url: "http://localhost:{{ backend_container_port }}/health"
        method: GET
        status_code: 200
      register: backend_health
      retries: 15
      delay: 3
      until: backend_health.status == 200


# -----------------------------------------------------------------------------
# Play 3 — Frontend VM
# -----------------------------------------------------------------------------
- name: Deploy frontend
  hosts: frontend_servers
  become: yes

  vars:
    frontend_image_user: "{{ dockerhub_user | default('dragneel277') }}"
    frontend_image_tag: "{{ image_tag | default('latest') }}"
    frontend_port: "{{ app_port | default('80') }}"
    frontend_backend_port: "{{ backend_port | default('3000') }}"
    backend_host_name: "{{ groups['backend_servers'][0] }}"

  tasks:
    - name: Install Docker and Python dependencies
      apt:
        name:
          - docker.io
          - python3-pip
        state: present
        update_cache: yes

    - name: Install Python Docker SDK
      pip:
        name: docker
        state: present
        extra_args: --break-system-packages

    - name: Ensure Docker service is running
      service:
        name: docker
        state: started
        enabled: yes

    - name: Pull frontend image from Docker Hub
      community.docker.docker_image:
        name: "{{ frontend_image_user }}/billing-frontend:{{ frontend_image_tag }}"
        source: pull
        force_source: yes

    - name: Run frontend container
      community.docker.docker_container:
        name: billing-frontend
        image: "{{ frontend_image_user }}/billing-frontend:{{ frontend_image_tag }}"
        state: started
        restart_policy: unless-stopped
        recreate: yes
        env:
          BACKEND_HOST: "{{ hostvars[backend_host_name].ansible_host }}"
          BACKEND_PORT: "{{ frontend_backend_port | string }}"
        published_ports:
          - "{{ frontend_port | string }}:80"

    - name: Wait for frontend to respond
      uri:
        url: "http://localhost:{{ frontend_port }}"
        method: GET
        status_code: 200
      register: frontend_health
      retries: 15
      delay: 3
      until: frontend_health.status == 200

    - name: Show running containers on app VM
      command: docker ps
      register: running_containers
      changed_when: false

    - name: Print running containers
      debug:
        var: running_containers.stdout_lines
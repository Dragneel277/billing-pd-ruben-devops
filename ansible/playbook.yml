---
# =============================================================================
# Deploy Billing App with Docker + Ansible
# Works for local WSL/Jenkins deployment
# =============================================================================

- name: Deploy Billing Application
  hosts: all
  become: yes

  vars:
    app_dir: /opt/billing-app

    db_name: billing_db
    db_user: billing_user
    db_password: "{{ db_password | default('billing_pass') }}"
    db_host: billing-db
    db_port: 5432

    backend_port: 3000
    app_port: "{{ app_port | default('3001') }}"

    docker_network: billing-net
    dockerhub_user: "{{ dockerhub_user | default('dragneel277') }}"
    image_tag: "{{ image_tag | default('latest') }}"

    jwt_secret: "{{ jwt_secret | default('mysecret123') }}"

  tasks:
    # -------------------------------------------------------------------------
    # Base setup
    # -------------------------------------------------------------------------

    - name: Install Docker and Python dependencies
      apt:
        name:
          - docker.io
          - python3-pip
        state: present
        update_cache: yes
      ignore_errors: yes

    - name: Install Python Docker SDK
      pip:
        name: docker
        state: present
        extra_args: --break-system-packages
      ignore_errors: yes

    - name: Create application directory
      file:
        path: "{{ app_dir }}"
        state: directory
        mode: "0755"

    - name: Create Docker network
      community.docker.docker_network:
        name: "{{ docker_network }}"
        state: present

    # -------------------------------------------------------------------------
    # Database
    # -------------------------------------------------------------------------

    - name: Run PostgreSQL container
      community.docker.docker_container:
        name: billing-db
        image: postgres:16-alpine
        state: started
        restart_policy: unless-stopped
        recreate: yes
        env:
          POSTGRES_DB: "{{ db_name }}"
          POSTGRES_USER: "{{ db_user }}"
          POSTGRES_PASSWORD: "{{ db_password }}"
        published_ports:
          - "{{ db_port }}:5432"
        networks:
          - name: "{{ docker_network }}"

    - name: Wait for PostgreSQL to be ready
      command: docker exec billing-db pg_isready -U {{ db_user }} -d {{ db_name }}
      register: pg_ready
      retries: 15
      delay: 3
      until: pg_ready.rc == 0
      changed_when: false


    # -------------------------------------------------------------------------
    # Backend
    # -------------------------------------------------------------------------

    - name: Pull backend image from Docker Hub
      community.docker.docker_image:
        name: "{{ dockerhub_user }}/billing-backend:{{ image_tag }}"
        source: pull
        force_source: yes

    - name: Run backend container
      community.docker.docker_container:
        name: billing-backend
        image: "{{ dockerhub_user }}/billing-backend:{{ image_tag }}"
        state: started
        restart_policy: unless-stopped
        recreate: yes
        env:
          PORT: "{{ backend_port | string }}"
          DB_HOST: "{{ db_host | string }}"
          DB_PORT: "{{ db_port | string }}"
          DB_NAME: "{{ db_name | string }}"
          DB_USER: "{{ db_user | string }}"
          DB_PASSWORD: "{{ db_password | string }}"
          JWT_SECRET: "{{ jwt_secret | string }}"
          JWT_EXPIRES_IN: "24h"
        published_ports:
          - "{{ backend_port }}:{{ backend_port }}"
        networks:
          - name: "{{ docker_network }}"

    # -------------------------------------------------------------------------
    # Frontend
    # -------------------------------------------------------------------------

    - name: Pull frontend image from Docker Hub
      community.docker.docker_image:
        name: "{{ dockerhub_user }}/billing-frontend:{{ image_tag }}"
        source: pull
        force_source: yes

    - name: Run frontend container
      community.docker.docker_container:
        name: billing-frontend
        image: "{{ dockerhub_user }}/billing-frontend:{{ image_tag }}"
        state: started
        restart_policy: unless-stopped
        recreate: yes
        env:
          BACKEND_HOST: "billing-backend"
          BACKEND_PORT: "{{ backend_port | string }}"
        published_ports:
          - "{{ app_port }}:80"
        networks:
          - name: "{{ docker_network }}"

    # -------------------------------------------------------------------------
    # Validation
    # -------------------------------------------------------------------------

    - name: Show running containers
      command: docker ps
      register: running_containers
      changed_when: false

    - name: Print running containers
      debug:
        var: running_containers.stdout_lines
